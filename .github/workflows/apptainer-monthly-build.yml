name: Apptainer Monthly Build

on:
  schedule:
    # 03:00 UTC on day 1 of every month
    - cron: '0 3 1 * *'
  pull_request:
    paths:
      - 'apptainer.ref'
      - 'Environments/environment.yml'
  workflow_dispatch:

jobs:
  compile-apptainer:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Apptainer
        uses: eWaterCycle/setup-apptainer@v2
      - name: Show Apptainer version
        run: apptainer --version

      - name: Build definition file
        run: apptainer build --fakeroot --sandbox /tmp/gwas-minimal apptainer.def

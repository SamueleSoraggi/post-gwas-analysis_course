[workspace]
name = "gwas-minimal"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
python = "3.9.*"
pip = "*"
jupyterlab = ">=4.0"
numpy = ">=1.23,<2"
pandas = ">=1.5,<3"
scipy = ">=1.10,<2"
scikit-learn = ">=1.3"
statsmodels = ">=0.14"
xgboost = ">=2.0"
scanpy = ">=1.9"
anndata = ">=0.9"
pyarrow = ">=14"
pyliftover = ">=0.4"
requests = ">=2.31"
tqdm = ">=4.66"
bitarray = "*"
r-ggplot2 = "*"
r-dplyr = "*"
r-pacman = "*"
r-qqman = "*"
r-scales = "*"
r-vroom = "*"
r-irkernel = "*"
bash_kernel = "*"
fastparquet = "*"
htslib         = "*"   # tabix / bgzip for region streaming
plink          = "*"   # signed LD matrix: plink --r square
bcftools       = "*"   # subset 1000G region + samples
r-susier       = ">=0.14.2"
"r-data.table" = "*"
"r-r.utils"    = "*"   # required by data.table::fread() to read the .gz GWAS file
r-matrix       = "*"


[pypi-dependencies]
scdrs = "*"
jupyterlab-quarto = "*"